services:
  license-server:
    build: .
    container_name: urscript-license-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # exposé uniquement en local ; Tailscale Funnel se charge du public
    environment:
      - LICENSE_ADMIN_TOKEN=${LICENSE_ADMIN_TOKEN}
      - PORT=8080
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
